version: '3.9'

services:

  postgres:
    image: postgres:17
    container_name: ecommerce_postgres

    environment:
      POSTGRES_DB: ecommerce_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 38080

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .

    container_name: ecommerce_app

    ports:
      - "8081:8081"

    depends_on:
      postgres:
        condition: service_healthy